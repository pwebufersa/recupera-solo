name: Aplicativo Android

run-name: Aplicativo Android · ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: app_android-main
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "versionName do APK; vazio usa a versao do package.json"
        required: false
      version_code:
        description: "versionCode inteiro; vazio usa o numero da execucao"
        required: false
  push:
    branches: [main]
    paths:
      - "codigo_fonte/**"
      - "app_android/gerar_app_android.ps1"
      - "app_android/assets/**"
      - ".github/workflows/aplicativo-android.yml"

jobs:
  app_android:
    name: Gerar APK
    runs-on: windows-latest
    env:
      VERSAO: ${{ inputs.versao }}
      CODIGO_INFORMADO: ${{ inputs.version_code }}
      CODIGO_BASE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      # As chaves são estáveis de propósito: o hash do gerador mudava a cada
      # ajuste no script e recriava centenas de megabytes de cache. A versão
      # do sufixo só muda quando o conjunto de ferramentas muda.
      - name: Cache das ferramentas
        id: cache-ferramentas
        uses: actions/cache@v5
        with:
          path: app_android/ferramentas
          key: ferramentas-v3-${{ runner.os }}
          restore-keys: |
            ferramentas-${{ runner.os }}-

      - name: Cache do Gradle
        id: cache-gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ runner.os }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache do projeto gerado
        id: cache-app
        uses: actions/cache@v5
        with:
          path: app_android/app
          key: app-v2-${{ runner.os }}
          restore-keys: |
            app-${{ runner.os }}-

      - name: Situação dos caches
        shell: pwsh
        run: |
          "ferramentas: ${{ steps.cache-ferramentas.outputs.cache-hit }}"
          "gradle: ${{ steps.cache-gradle.outputs.cache-hit }}"
          "app: ${{ steps.cache-app.outputs.cache-hit }}"

      - name: Preparar a chave de assinatura
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          $destino = "app_android/segredos"
          New-Item -ItemType Directory -Force -Path $destino | Out-Null
          if ($env:KEYSTORE_BASE64) {
            [IO.File]::WriteAllBytes("$destino/recupera-solo.keystore", [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          }
          if ($env:KEYSTORE_PROPERTIES) {
            [IO.File]::WriteAllText("$destino/keystore.properties", $env:KEYSTORE_PROPERTIES)
          }
          if (-not $env:KEYSTORE_BASE64) {
            Write-Host "Sem segredo de chave: uma chave nova sera gerada e o APK nao atualizara instalacoes anteriores."
          }

      - name: Gerar o APK
        shell: pwsh
        working-directory: app_android
        run: |
          # Expressoes do GitHub nao fazem aritmetica; o deslocamento e feito aqui.
          $versao = if ($env:VERSAO) { $env:VERSAO } else { (Get-Content ..\package.json -Raw | ConvertFrom-Json).version }
          $codigo = if ($env:CODIGO_INFORMADO) { [int]$env:CODIGO_INFORMADO } else { [int]$env:CODIGO_BASE + 100 }
          "VERSAO=$versao" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CODIGO=$codigo" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          powershell -NoProfile -ExecutionPolicy Bypass -File .\gerar_app_android.ps1 -Versao $versao -VersionCode $codigo

      - name: Registrar versão e testes
        shell: pwsh
        working-directory: app_android
        run: |
          $apk = Get-ChildItem dist -Filter "*.apk" | Select-Object -First 1
          $hash = (Get-FileHash $apk.FullName -Algorithm SHA256).Hash
          @(
            "aplicativo: $($apk.Name)",
            "versao: $env:VERSAO",
            "versionCode: $env:CODIGO",
            "commit: $env:GITHUB_SHA",
            "execucao: $env:GITHUB_RUN_NUMBER",
            "testes: fluxo Testes automaticos",
            "sha256: $hash"
          ) | Set-Content -Encoding UTF8 dist/INFO.txt
          Get-Content dist/INFO.txt

      - uses: actions/upload-artifact@v5
        with:
          name: recupera-solo-app-android
          path: |
            app_android/dist/*.apk
            app_android/dist/SHA256.txt
            app_android/dist/INFO.txt
          retention-days: 30
      - name: Publicar o APK na pasta app_android
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $apk = Get-ChildItem app_android/dist -Filter "*.apk" | Select-Object -First 1
          Copy-Item $apk.FullName "app_android/RECUPERA-SOLO.apk" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_android/RECUPERA-SOLO.apk
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "APK sem mudanca; nada a publicar."
            exit 0
          }
          git commit -m "Publica o APK $env:VERSAO (versionCode $env:CODIGO) [skip ci]"

          # Outro commit pode chegar durante o build; rebase antes de empurrar.
          for ($tentativa = 1; $tentativa -le 3; $tentativa++) {
            git pull --rebase --autostash origin main
            git push
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar o APK no repositorio." }
