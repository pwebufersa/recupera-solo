name: Páginas

on:
  push:
    branches: [main]
    paths:
      - "codigo_fonte/**"
      - ".github/workflows/paginas.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar o site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: codigo_fonte
      - id: deploy
        uses: actions/deploy-pages@v5
