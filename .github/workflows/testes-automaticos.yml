name: Testes automáticos

run-name: Testes automáticos · ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Cálculo e navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Cache do Playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Relatório do navegador
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
