name: Testes automáticos

run-name: Testes automáticos · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Cálculo e navegador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Relatório do navegador
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-playwright
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
